name: Build portable package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            C:\vrclib-build
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # 产物目录用 ASCII 路径：Rust 在中文路径下会让 dlltool 打不开 .def
      - name: Build (release)
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: C:\vrclib-build
        run: cargo build --release

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "C:\vrclib-build\release\vrclib.exe" "dist\VRChat改模素材管理库.exe"
          # WebView2Loader.dll 必须和 exe 同目录，否则启动即 0xC0000135
          Copy-Item "C:\vrclib-build\release\WebView2Loader.dll" "dist\"
          Copy-Item "启动素材库_Tauri版.bat" "dist\"
          Compress-Archive -Path "dist\*" -DestinationPath "vrchat-asset-library_v${ver}_win-x64.zip" -Force

      - name: Show artifact
        shell: pwsh
        run: Get-ChildItem *.zip | Format-Table Name, Length

      - name: Drop stale zip assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          want="vrchat-asset-library_v${tag#v}_win-x64.zip"
          gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | while read -r name; do
            if [ -n "$name" ] && [ "$name" != "$want" ]; then
              echo "removing stale asset: $name"
              gh release delete-asset "$tag" "$name" -y || true
            fi
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          fail_on_unmatched_files: true
