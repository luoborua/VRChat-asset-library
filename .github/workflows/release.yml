name: Build portable package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron
        working-directory: electron
        run: npm ci

      - name: Build portable zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File electron/build/package-portable.ps1 -Version "${{ github.ref_name }}"

      - name: Show artifact
        shell: powershell
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Drop stale zip assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          want="vrchat-asset-library_v${tag#v}_win-x64.zip"
          gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | while read -r name; do
            if [ -n "$name" ] && [ "$name" != "$want" ]; then
              echo "removing stale asset: $name"
              gh release delete-asset "$tag" "$name" -y || true
            fi
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
