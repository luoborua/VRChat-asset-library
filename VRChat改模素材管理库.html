<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <span class="brand-main">
      <span class="logo">&#x1F4E6;</span>
      <span>VRChat 改模素材库</span>
    </span>
    <small id="brandVersion">本地素材管理 · v1.1</small>
  </div>

  <button class="icon-btn" id="btnSidebar" title="显示 / 隐藏筛选栏">&#x2630;</button>

  <div class="search-wrap">
    <span class="search-ico">&#x1F50D;</span>
    <input id="searchInput" type="search" placeholder="搜索标题、原标题、标签、角色、路径、简介、备注…（按 / 聚焦）" autocomplete="off">
    <button id="searchClear" title="清空搜索">&#x2715;</button>
  </div>
  <button class="btn btn-sm" id="btnFuzzy" title="模糊搜索：按同义词/俗称匹配并容忍错别字（需先在 设置 → AI 翻译 生成词表）">模糊搜索</button>

  <div class="topbar-spacer"></div>

  <div class="topbar-actions">
    <button class="icon-btn" id="btnTheme" title="切换主题 (T)">&#x1F319;</button>
    <button class="btn" id="btnSelectMode" title="多选模式：勾选多个素材后批量操作">&#x2611;<span class="label">多选</span></button>
    <button class="btn" id="btnImport" title="导入本地文件夹 / 已购素材 / 粘贴多个链接批量添加">&#x1F4E5;<span class="label">导入</span></button>
    <button class="btn btn-primary" id="btnAdd" title="添加素材 (N)">&#x2795;<span class="label">添加素材</span></button>
    <button class="btn" id="btnSettings" title="设置">&#x2699;<span class="label">设置</span></button>
  </div>
<div class="win-controls" id="winControls">
<button class="win-btn" id="winMin" title="最小化">&#xE921;</button>
<button class="win-btn" id="winMax" title="最大化">&#xE922;</button>
<button class="win-btn win-close" id="winClose" title="关闭">&#xE8BB;</button>
</div>
</header>

<div class="layout">
  <!-- 侧栏筛选 -->
  <aside class="sidebar">
    <div id="sidebarBody"></div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <div class="toolbar">
      <span id="resultInfo">共 0 项</span>
      <span class="grow"></span>
      <span class="toolbar-controls">
        <button class="icon-btn view-btn active" data-view="grid" title="网格视图：再点一次切换卡片大小（中 → 大 → 小）">&#x25A6;</button>
        <button class="icon-btn view-btn" data-view="list" title="列表视图 (G)">&#x2261;</button>
        <button class="icon-btn" id="btnRefresh" title="刷新（重新读取素材库并重画）">&#x21BB;</button>
        <span class="toolbar-gap"></span>
        <select id="sortSelect" class="input" title="排序方式"></select>
      </span>
    </div>

    <!-- 批量操作条 -->
    <div class="bulk-bar" id="bulkBar">
      <b>已选 <span id="bulkCount">0</span> 项</b>
      <button class="btn btn-sm" id="bulkSelectAll">全选当前结果</button>
      <button class="btn btn-sm" id="bulkNone">取消选择</button>
      <button class="btn btn-sm" id="bulkCategory">设置分类</button>
      <button class="btn btn-sm" id="bulkTag">添加标签</button>
      <button class="btn btn-sm" id="bulkAvatar">设置角色</button>
      <button class="btn btn-sm" id="bulkDownloaded" title="按磁盘对账重新检查所选素材：缺文件 / 路径失效 / 仅远端">重新扫描磁盘状态</button>
      <button class="btn btn-sm" id="bulkHide">隐藏</button>
      <button class="btn btn-sm" id="bulkDownloadMissing">下载缺失文件</button>
      <button class="btn btn-sm" id="bulkExport">导出 CSV</button>
      <button class="btn btn-sm" id="bulkExportPack" title="把选中的素材连文件一起打成一个包，发给别人导入">导出素材包</button>
      <button class="btn btn-sm btn-danger-ghost" id="bulkDelete">删除</button>
      <span class="grow"></span>
      <button class="btn btn-sm" id="bulkExit">退出多选</button>
    </div>

    <div class="grid" id="grid" data-size="m"></div>

    <div class="pager" id="pager" style="display:none"></div>

    <div class="empty-state" id="emptyState" style="display:none">
      <div class="emoji">&#x1F4E6;</div>
      <p id="emptyText">素材库还是空的，点击右上角「+ 添加素材」开始建立你的改模素材库。</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-primary" id="emptyAdd">&#x2795; 添加第一个素材</button>
        <button class="btn" id="emptyDemo">&#x1F9EA; 载入示例数据</button>
      </div>
    </div>
  </main>
</div>
